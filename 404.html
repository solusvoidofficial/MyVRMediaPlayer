<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — My VR Media Player</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="https://solusvoidofficial.github.io/MyVRMediaPlayer/assets/icon.svg">
  <link rel="icon" href="https://solusvoidofficial.github.io/MyVRMediaPlayer/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="https://solusvoidofficial.github.io/MyVRMediaPlayer/assets/img/apple-touch-icon.png">
  <link rel="manifest" href="https://solusvoidofficial.github.io/MyVRMediaPlayer/assets/site.webmanifest">
  <!-- Self-contained page: GitHub Pages serves 404.html for paths at any depth,
       so relative asset URLs would break. Links and styles are absolute/inline. -->
  <style>
    :root {
      --bg: #0a0a0a; --panel: #161616; --line: #2a2a2e;
      --text: #f2f2f2; --muted: #b6b6bd;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f5f5f5; --panel: #fff; --line: #dcdcdc; --text: #111; --muted: #5a5a5a; }
    }
    * { box-sizing: border-box; }
    body {
      display: flex; flex-direction: column; min-height: 100vh; margin: 0;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.65; -webkit-font-smoothing: antialiased;
    }
    main { flex: 1; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
    header { border-bottom: 1px solid var(--line); }
    header .wrap { display: flex; align-items: center; gap: 14px; min-height: 64px; flex-wrap: wrap; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; color: var(--text); text-decoration: none; }
    .mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: #fff; border: 1px solid rgba(0,0,0,.08); }
    .mark img { display: block; width: 27px; height: 27px; }
    nav { margin-left: auto; display: flex; gap: 2px; font-size: 15px; }
    nav a { color: var(--muted); text-decoration: none; padding: 7px 10px; border-radius: 9px; }
    nav a:hover, nav a:focus-visible { color: var(--text); background: var(--panel); }
    main { padding: 64px 0 72px; }
    h1 { font-size: clamp(32px, 6vw, 48px); line-height: 1.08; letter-spacing: -0.03em; margin: 0 0 12px; }
    p { color: var(--muted); max-width: 52ch; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
    .btn { display: inline-flex; padding: 12px 20px; border-radius: 12px; font-weight: 600; font-size: 15px; text-decoration: none; border: 1px solid var(--line); color: var(--text); }
    .btn.primary { background: var(--text); border-color: var(--text); color: var(--bg); }
    .btn:hover { filter: brightness(1.08); }
    footer { border-top: 1px solid var(--line); padding: 22px 0 40px; color: var(--muted); font-size: 14px; }
    a:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    @media (max-width: 640px) {
      header .wrap { gap: 10px; min-height: 56px; padding-top: 8px; padding-bottom: 8px; }
      .brand span + span { display: none; }
      nav { font-size: 14px; }
      nav a { padding: 7px 8px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="https://solusvoidofficial.github.io/MyVRMediaPlayer/" aria-label="My VR Media Player home">
        <span class="mark"><img src="https://solusvoidofficial.github.io/MyVRMediaPlayer/assets/icon.svg" alt="" width="27" height="27"></span>
        <span>My VR Media Player</span>
      </a>
      <nav aria-label="Site">
        <a href="https://solusvoidofficial.github.io/MyVRMediaPlayer/">Home</a>
        <a href="https://solusvoidofficial.github.io/MyVRMediaPlayer/privacy/">Privacy</a>
        <a href="https://solusvoidofficial.github.io/MyVRMediaPlayer/terms/">Terms</a>
        <a href="https://solusvoidofficial.github.io/MyVRMediaPlayer/licenses/">Licenses</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <h1>Page not found</h1>
      <p>This page does not exist. The links below take you back to the site.</p>
      <div class="actions">
        <a class="btn primary" href="https://solusvoidofficial.github.io/MyVRMediaPlayer/">Home</a>
        <a class="btn" href="https://solusvoidofficial.github.io/MyVRMediaPlayer/privacy/">Privacy Policy</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">&copy; 2026 SolusVoid — My VR Media Player</div>
  </footer>
</body>
</html>
